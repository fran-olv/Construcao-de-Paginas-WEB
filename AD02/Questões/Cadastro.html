<!DOCTYPE html>
<html><head><title>DOReMI SOlfa Móveis</title>
<base target="_blank" >
<link rel="stylesheet" type="text/css" href="style.css" >
<link href='https://fonts.googleapis.com/css?family=Karla|Stoke'
      rel='stylesheet'>
<script>
function verificarSenha() {
    var senha  = document.getElementById('idSenha').value;
    var conf   = document.getElementById('idConf').value;
    if (senha !== '' && conf !== '') {
        if (senha !== conf) {
            alert('Senhas estão diferentes!');
            return false;
        }
    }
    return true;
}
</script>
</head>
<body>
<header>
<address class="ender">
    Tv. La Donna e Mobile, 134<br>
    Tel: (21) 91224-4881<br>
    <a href="mailto:contato@doremisolfa.com.br">
    contato@doremisolfa.com.br</a></address>
    <img  class="imgLogo" src="../Imagens/DoremisofaLogoTopo.png"><br>
</header>
<nav>
<ul><li><a href="DoremisolfaMoveis.html">Apresentação</a></li>
    <li><a href="Doremi.html">Camas</a></li>
    <li><a href="Solfa.html">Sofás</a></li>
    <li><a href="Encomendas.html">Encomendas</a></li></ul>
</nav>

<section>
<h3 class="Titulo">Cadastro</h3>

<div class="FormBox">
<br>
<form method="POST" onsubmit="return verificarSenha()">
<fieldset class="FSLinInteira">
<legend>Identificação</legend>

<div class="LinhaForm">
<label for="idEmailGnd" class="LabBox">E-mail:</label>
<input id="idEmailGnd"  class="InpBoxGnd"
       type="email"  name="TxtEmail" required ></div>
<div class="LinhaForm">
<span class="ColEsq">
<label for="idSenha" class="LabBox">Senha:</label>
<input id="idSenha"  class="InpBoxMed"
       type="password" name="TxtSenha" required
       onchange="verificarSenha()" ></span>

<span class="ColDir">
<label for="idConf" class="LabBox">Confirme:</label>
<input id="idConf"  class="InpBoxMed"
       type="password" name="TxtConf" required
       onchange="verificarSenha()" ></span>
</div>
</fieldset>

<fieldset class="FSLinInteira">
<legend>Dados Pessoais</legend>

<div class="LinhaForm">
<label for="idNome" class="LabBox">Nome:</label>
<input id="idNome"  class="InpBoxGnd"
       type="text"  name="TxtNome" required ></div>
<div class="LinhaForm" id="linhaEnder">
<label class="LabBox">Endereço: </label>
<textarea name="TxtEnder" class="InpBoxGnd"
          id="inpEnder" ></textarea>
</div>

<div class="LinhaForm">
<span class="ColEsq">
<label class="LabBox">Telefone:</label>
<input type="text" class="InpBoxMed"
       name="TxtTelefone" required >
</label></span>
<span class="ColDir">
<label class="LabBox">Celular:</label>
<input type="text" class="InpBoxMed"
       name="TxtCelular" >
</span></div>

<fieldset class="FSColEsq"><legend>Nacimento:</legend>
<input type="number" name="TxtDiaNasc"
       min="1" max="31" class="numDD" > /
<input type="number" name="TxtMesNasc"
       min="1" max="12" class="numDD"  > /
<input type="number" name="TxtAnoNasc"
       min="1930" max="2008" class="numQD"  >
</fieldset>

<fieldset class="FSColDir"><legend>Sexo:</legend>
<label><input type="radio" name="TglSexo"
       value="M" >Mas</label>
<label><input type="radio" name="TglSexo"
       value="F" >Fem</label>
<label><input type="radio" name="TglSexo"
       value="O" checked >Outro</label>
</fieldset>
</fieldset>

<div class="botoes">
    <input type="submit" value="Cadastrar" >
    <input type="reset"  value="Limpar" >
</div></div>
</section>
</body></html>
