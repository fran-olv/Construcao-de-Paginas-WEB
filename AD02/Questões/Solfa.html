<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>DOReMI SOlFÁ Móveis - Sofás</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla&family=Stoke&display=swap">
<link rel="stylesheet" href="style.css">
<script>
/* Vetor de produtos: [lugares, tipo, dimensoes, tecido, imagem, preco] */
var sofas = [
    ['Sofá 2 lugares', 'Retrátil',  '95 x 87-126 x 180',  'Linho Cru', 'Sofa2lugRetratil150.png', '765,00'],
    ['Sofá 2 lugares', 'Sofá-Cama', '95 x 97-150 x 180',  'Linho',     'SofaCama2lug150.png',     '4160,00'],
    ['Sofá 3 lugares', 'Retrátil',  '108 x 95-155 x 200', 'Suede',     'Sofa3lugRetratil150.png', '1900,00'],
    ['Sofá 3 lugares', 'Retrô',     '80 x 76 x 196',      'Veludo',    'Sofa3lugRetro150.png',    '1200,00']
];

function mostrarSofa(i) {
    var s = sofas[i];
    document.getElementById('NomeDes').innerHTML =
        '<b style="font-size:16px">' + s[0] + '</b><br>' + s[1];
    document.getElementById('ImgDes').innerHTML =
        '<img class="imgSofa" src="../Imagens/' + s[4] + '" alt="' + s[1] + '">';
    document.getElementById('PrcDes').innerHTML =
        'Tecido: ' + s[3] + '<br>' +
        'Tamanho: ' + s[2] + ' (AxPxL)<br>' +
        '<span style="color:#CC0000">Preço: R$ ' + s[5] + '</span>';
}
</script>
</head>
<body>

<header>
    <img class="imgLogo" src="../Imagens/DoremisofaLogoTopo.png" alt="DOReMI SOlFÁ Móveis">
    <address class="ender">
        Tv. La Donna e Mobile, 134<br>
        Tel: (21) 91224-4881<br>
        <a href="mailto:contato@doremisolfa.com.br">contato@doremisolfa.com.br</a>
    </address>
</header>

<nav>
    <ul>
        <li><a href="DoremisolfaMoveis.html" target="_blank">Apresentação</a></li>
        <li><a href="Doremi.html" target="_blank">Camas</a></li>
        <li><a href="Solfa.html" target="_blank">Sofás</a></li>
        <li><a href="Encomendas.html" target="_blank">Encomendas</a></li>
    </ul>
</nav>

<section>
    <h3 class="titulo">Seção SOlFÁ</h3>
    <table class="tabSofa">
        <tr>
            <th colspan="3" class="titulo">Sofás e Sofás-camas</th>
        </tr>
        <tr>
            <th class="linTH">Produto</th>
            <th class="linTH">Tipo</th>
            <th class="linTH">Descrição</th>
        </tr>
        <tr>
            <th rowspan="2" class="colTH">Sofá 2 lugares</th>
            <td><a href="javascript:void(0)" onclick="mostrarSofa(0)">Retrátil</a></td>
            <td rowspan="4" class="descTab">
                <div id="NomeDes">&nbsp;</div>
                <div id="ImgDes"><img class="imgSofa" src="../Imagens/vazio_150.png" alt=""></div>
                <div id="PrcDes">&nbsp;</div>
            </td>
        </tr>
        <tr>
            <td><a href="javascript:void(0)" onclick="mostrarSofa(1)">Sofá-Cama</a></td>
        </tr>
        <tr>
            <th rowspan="2" class="colTH">Sofá 3 lugares</th>
            <td><a href="javascript:void(0)" onclick="mostrarSofa(2)">Retrátil</a></td>
        </tr>
        <tr>
            <td><a href="javascript:void(0)" onclick="mostrarSofa(3)">Retrô</a></td>
        </tr>
    </table>
</section>

</body>
</html>
