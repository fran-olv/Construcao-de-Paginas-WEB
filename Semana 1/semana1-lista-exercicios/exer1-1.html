        <h1 aligh="center">Poema</h1>
        <hr>
        <p><h2 aligh="left">Nada vos oferto além <br> destas mortes de que me <br> alimento</h2></p>
        <p><h2 aligh="right">Caminhos não há Mas os <br> pés na grama os <br> inventarão</h2></p>
        <p><h2 alight="center">Aqui se inicia uma viagem <br> clara para a encatação</h2>
        <p><h2 alight="left">Fonte, flor em fogo, que é <br> que nos espera por detrás <br> da noite?</h2>
        <p><h2 alight="right">Nada vos sovino: com a <br> minha incerteza voz <br> ilumino</h2>
        <hr>
        <h2><i> Ferreira Gullar</i> </h2>
